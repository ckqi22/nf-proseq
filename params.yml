# ============================================================
# PRO-seq — Nextflow 自动化分析流程
# ============================================================

# ---- 项目基本信息 ----
name: "PRO-seq"
projectNo.: "projectNo"
institute: "institute"
species: mouse
build: null
instrument_model: Illumina_NovaSeq_6000
sample_type: cell
sample_number: 2
gtf:
genome_fasta:

# ---- Spike-in 配置（无 spike-in 则留空）----
# spike_genome 填 information_config 里的 section 名（如 dm6）；留空则完全跳过 spike-in。
spike_genome: 
spike_fasta:             # 可选：直接给 spike fasta 路径，覆盖 DB 解析
spike_gtf:               # 预留（本次不参与计数，idxstats 按染色体统计）
spike_index:             # 可选：预构建「主+spike 合并」bowtie2 index 前缀；给则跳过 concat+build
spike_chroms:            # 可选：spike 染色体名单文件（配合 spike_index，不再从 spike_fasta 派生）

# ---- 分析参数 ----
adapter: I                     # [I, UMI, HT, SP 择其一]
adapter_sequence: "TGGAATTCTCGGGTGCCAAGG"   # Illumina TruSeq small RNA 3' 接头 (RA3)，仅 adapter=I 时生效
sample_sheet: "samplesheet.csv"
umi_length: 7                  # UMI 长度（仅 adapter=UMI 时生效）
normalize_methods: "cpm,fpkm"  # profile 表归一化方法（cpm/fpkm，逗号分隔，默认两者都做）
signal_mode: single            # 后续分析(metagene/PI)信号类型：single=单碱基5'端(默认) / full=full read 全长覆盖度

# ---- 报告 ----
report: true                  # 开关：false 完全跳过报告步骤

# ---- 质控阈值 ----
threshold:
  data_amount: 9.3G            # 双端数据量阈值
  data_percentage: 0.8         # 容许偏差比例
  duplicate_rate: 0.6          # 重复率阈值
  mapping_rate: 0.2            # 比对率阈值
  de_number: 300               # 差异基因数量阈值

# ---- TSS 暂停指数参数 ----
tss:
  upstream: 50                 # TSS 上游窗口（bp），默认 TSS-50bp
  downstream: 300              # TSS 下游窗口（bp），默认 TSS+300bp
  genebody_offset: 301         # 基因体起始偏移（bp），TSS+301bp 起
  min_gene_length: 800         # 最小基因长度（bp），短于此值不计算 PI
  pi_pseudocount: 1e-3         # PI 分子分母同加的伪计数，避免 genebody=0 时分母为 0

# ---- Metagene 分析 ----
metagene:
  profile_upstream: 1000       # profile TSS 上游窗口（bp）
  profile_downstream: 1000     # profile TSS 下游窗口（bp）
  heatmap_upstream: 50         # heatmap TSS 上游窗口（bp）
  heatmap_downstream: 150      # heatmap TSS 下游窗口（bp）
  bin_size: 10                 # bin 大小（bp）

# ---- 差异分析 ----
diff:
  fc_cutoff: 1.5               # 默认 Fold Change 阈值
  pval_cutoff: 0.05            # 默认 P-value 阈值

# ---- 比较组（A vs B, FC, P, paired/unpaired）----
compared_groups:
  - treatment, control, 1.5, 0.05, paired
